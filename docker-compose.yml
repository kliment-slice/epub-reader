services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_TTS_API_URL: http://localhost:8080
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/next ]; then npm ci; fi; npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_TTS_API_URL: http://localhost:8080
      HOST: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - tts-api
    restart: unless-stopped

  tts-api:
    build:
      context: ./tts-api-rust
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next:
