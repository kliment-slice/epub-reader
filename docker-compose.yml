services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_TTS_API_URL: http://localhost:8080
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/next ]; then npm ci; fi; npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_TTS_API_URL: http://localhost:8080
      HOST: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - tts-api
    restart: unless-stopped

  tts-api:
    build:
      context: ./tts-api-rust
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      # Mount source for hot-reload with cargo-watch (dev mode)
      - ./tts-api-rust/src:/app/src:ro
      - ./tts-api-rust/config.json:/app/config.json:ro
      - ./tts-api-rust/Cargo.toml:/app/Cargo.toml:ro
      # Mount models so they don't need to be copied each build
      - ./tts-api-rust/models:/app/models:ro
    environment:
      RUST_LOG: info
      RUST_BACKTRACE: 1
      KOKORO_MODEL: /app/models/kokoro-v1.0.onnx
      KOKORO_VOICES: /app/models/voices-v1.0.bin
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next:
