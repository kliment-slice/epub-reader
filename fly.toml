# fly.toml app configuration file for epub-reader-tts
# Located at repo root for Fly GitHub integration compatibility

app = 'epub-reader-tts'
primary_region = 'ams'

[build]
  dockerfile = 'tts-api-rust/Dockerfile'

[env]
  PORT = '8080'
  KOKORO_MODEL = '/app/kokoro-v1.0.onnx'
  KOKORO_VOICES = '/app/voices-v1.0.bin'
  TTS_MAX_CONCURRENCY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
