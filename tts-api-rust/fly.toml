# Fly.io configuration for TTS API (Rust)
app = 'epub-reader-tts'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  KOKORO_MODEL = '/app/kokoro-v1.0.onnx'
  KOKORO_VOICES = '/app/voices-v1.0.bin'
  TTS_MAX_CONCURRENCY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0  # Scale to zero when idle
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
